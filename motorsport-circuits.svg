<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <!-- Чистый матовый фон в цвет GitHub Dark -->
  <rect width="800" height="180" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- ================= ИКОНКА: СКОБКИ + КОНТУР ТРАССЫ ================= -->
  <g transform="translate(36, 26)">
    <!-- Левая скобка { -->
    <path d="M 32 14 C 16 14, 16 18, 16 34 L 16 52 C 16 62, 6 64, 6 64 C 6 64, 16 66, 16 76 L 16 94 C 16 110, 16 114, 32 114" fill="none" stroke="#8B949E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Правая скобка } -->
    <path d="M 140 14 C 156 14, 156 18, 156 34 L 156 52 C 156 62, 166 64, 166 64 C 166 64, 156 66, 156 76 L 156 94 C 156 110, 156 114, 140 114" fill="none" stroke="#8B949E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Лаконичный технический контур трассы -->
    <path d="M 48 88 L 106 88 C 126 88, 134 68, 120 56 C 110 48, 96 54, 92 42 C 88 30, 62 32, 54 48 C 46 64, 34 88, 48 88 Z" fill="none" stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Узловые точки полилинии (x, y) -->
    <circle cx="106" cy="88" r="3.5" fill="#0D1117" stroke="#8B949E" stroke-width="2.5" />
    <circle cx="120" cy="56" r="3.5" fill="#0D1117" stroke="#8B949E" stroke-width="2.5" />
    <circle cx="92" cy="42" r="3.5" fill="#0D1117" stroke="#8B949E" stroke-width="2.5" />
    <circle cx="54" cy="48" r="3.5" fill="#0D1117" stroke="#8B949E" stroke-width="2.5" />

    <!-- Стартовая точка (0.0, 0.0) — единственный яркий гоночный акцент -->
    <circle cx="48" cy="88" r="5" fill="#E10600" stroke="#0D1117" stroke-width="2" />
  </g>

  <!-- Вертикальный разделитель -->
  <line x1="236" y1="40" x2="236" y2="140" stroke="#21262D" stroke-width="1.5" />

  <!-- ================= ТЕКСТ В КРИВЫХ (НЕ ЗАВИСИТ ОТ ШРИФТОВ!) ================= -->
  <g transform="translate(268, 48)">
    
    <!-- Слово: MOTORSPORT (белый цвет, технические геометрические буквы) -->
    <g fill="none" stroke="#F0F6FC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- M -->
      <path d="M 0 32 L 0 0 L 13 18 L 26 0 L 26 32" />
      <!-- O -->
      <rect x="38" y="0" width="22" height="32" rx="6" />
      <!-- T -->
      <path d="M 70 0 L 92 0 M 81 0 L 81 32" />
      <!-- O -->
      <rect x="102" y="0" width="22" height="32" rx="6" />
      <!-- R -->
      <path d="M 136 32 L 136 0 L 150 0 C 159 0, 159 16, 150 16 L 136 16 M 147 16 L 157 32" />
      <!-- S -->
      <path d="M 190 5 C 190 0, 169 0, 169 8 C 169 18, 190 14, 190 24 C 190 32, 169 32, 169 27" />
      <!-- P -->
      <path d="M 202 32 L 202 0 L 216 0 C 225 0, 225 16, 216 16 L 202 16" />
      <!-- O -->
      <rect x="235" y="0" width="22" height="32" rx="6" />
      <!-- R -->
      <path d="M 269 32 L 269 0 L 283 0 C 292 0, 292 16, 283 16 L 269 16 M 280 16 L 290 32" />
      <!-- T -->
      <path d="M 301 0 L 323 0 M 312 0 L 312 32" />
    </g>

    <!-- Слово: CIRCUITS (спокойный серый цвет) -->
    <g transform="translate(0, 52)" fill="none" stroke="#8B949E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- C -->
      <path d="M 20 5 C 18 0, 0 0, 0 13 C 0 26, 18 26, 20 21" />
      <!-- I -->
      <path d="M 32 0 L 32 26" />
      <!-- R -->
      <path d="M 44 26 L 44 0 L 56 0 C 63 0, 63 13, 56 13 L 44 13 M 53 13 L 61 26" />
      <!-- C -->
      <path d="M 92 5 C 90 0, 72 0, 72 13 C 72 26, 90 26, 92 21" />
      <!-- U -->
      <path d="M 104 0 L 104 18 C 104 26, 122 26, 122 18 L 122 0" />
      <!-- I -->
      <path d="M 134 0 L 134 26" />
      <!-- T -->
      <path d="M 145 0 L 163 0 M 154 0 L 154 26" />
      <!-- S -->
      <path d="M 190 4 C 190 0, 173 0, 173 6.5 C 173 14, 190 12, 190 19.5 C 190 26, 173 26, 173 22" />
    </g>

    <!-- Бейдж: .JSON (тоже полностью в кривых) -->
    <g transform="translate(212, 45)">
      <rect width="98" height="38" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
      <!-- Гоночный красный уголок-акцент на бейдже -->
      <path d="M 0 6 C 0 2.7, 2.7 0, 6 0 L 10 0 L 0 10 Z" fill="#E10600" />
      
      <g transform="translate(16, 9)" fill="none" stroke="#58A6FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Точка . -->
        <circle cx="2" cy="18" r="1" fill="#58A6FF" />
        <!-- J -->
        <path d="M 19 0 L 19 14 C 19 20, 10 20, 10 15" />
        <!-- S -->
        <path d="M 38 3 C 38 0, 26 0, 26 5 C 26 11, 38 9, 38 15 C 38 20, 26 20, 26 17" />
        <!-- O -->
        <rect x="45" y="0" width="13" height="20" rx="4" />
        <!-- N -->
        <path d="M 65 20 L 65 0 L 77 20 L 77 0" />
      </g>
    </g>

  </g>
</svg>