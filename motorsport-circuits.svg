<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="220">
  <defs>
    <!-- Глубокий темный фон -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#131B2E" />
    </linearGradient>

    <!-- Неоновый градиент трассы -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54" />
      <stop offset="50%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <!-- Градиент для скобок JSON -->
    <linearGradient id="braceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#1F6FEB" />
    </linearGradient>

    <!-- Неоновое свечение трассы -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон баннера -->
  <rect width="820" height="220" rx="16" fill="url(#bg)" stroke="#263042" stroke-width="1.5" />

  <!-- ================= ИКОНКА ТРАССЫ СО СКРИНШОТА ================= -->
  <g transform="translate(28, 12)">
    <!-- Теплый ореол под трассой -->
    <circle cx="110" cy="98" r="72" fill="#FF5500" fill-opacity="0.07" />

    <!-- Пунктирные оси координат X / Y -->
    <line x1="35" y1="142" x2="185" y2="142" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="62" y1="28" x2="62" y2="172" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Левая фигурная скобка { -->
    <path d="M 42 18 C 20 18, 20 22, 20 44 L 20 80 C 20 94, 6 100, 6 100 C 6 100, 20 106, 20 120 L 20 156 C 20 178, 20 182, 42 182" fill="none" stroke="url(#braceGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Правая фигурная скобка } -->
    <path d="M 178 18 C 200 18, 200 22, 200 44 L 200 80 C 200 94, 214 100, 214 100 C 214 100, 200 106, 200 120 L 200 156 C 200 178, 200 182, 178 182" fill="none" stroke="url(#braceGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Темная подложка контура трассы -->
    <path d="M 62 142 L 125 142 C 155 142, 168 119, 152 101 C 140 87, 122 95, 118 79 C 114 63, 142 55, 134 39 C 126 23, 85 29, 74 51 C 65 69, 42 79, 46 109 C 49 129, 52 142, 62 142 Z" fill="none" stroke="#090D16" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Сама неоновая трасса с градиентом и свечением -->
    <path d="M 62 142 L 125 142 C 155 142, 168 119, 152 101 C 140 87, 122 95, 118 79 C 114 63, 142 55, 134 39 C 126 23, 85 29, 74 51 C 65 69, 42 79, 46 109 C 49 129, 52 142, 62 142 Z" fill="none" stroke="url(#trackGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Белая пунктирная осевая линия (centerline) -->
    <path d="M 62 142 L 125 142 C 155 142, 168 119, 152 101 C 140 87, 122 95, 118 79 C 114 63, 142 55, 134 39 C 126 23, 85 29, 74 51 C 65 69, 42 79, 46 109 C 49 129, 52 142, 62 142 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3 5" stroke-opacity="0.75" />

    <!-- Узловые точки полилинии (x, y) -->
    <circle cx="125" cy="142" r="4" fill="#0D1117" stroke="#FF5500" stroke-width="2.5" />
    <circle cx="152" cy="101" r="4" fill="#0D1117" stroke="#FF8800" stroke-width="2.5" />
    <circle cx="118" cy="79" r="3.5" fill="#0D1117" stroke="#FFAA00" stroke-width="2.5" />
    <circle cx="134" cy="39" r="4" fill="#0D1117" stroke="#FFCC00" stroke-width="2.5" />
    <circle cx="74" cy="51" r="4" fill="#0D1117" stroke="#FF7700" stroke-width="2.5" />
    <circle cx="46" cy="109" r="4" fill="#0D1117" stroke="#FF3344" stroke-width="2.5" />

    <!-- Стартовая точка (0.0, 0.0) -->
    <circle cx="62" cy="142" r="9" fill="#FF2A54" fill-opacity="0.3" />
    <circle cx="62" cy="142" r="5.5" fill="#FFFFFF" stroke="#FF2A54" stroke-width="3" />

    <!-- Плашка "0.0, 0.0" (нарисована в кривых, не зависит от шрифтов) -->
    <g transform="translate(34, 154)">
      <rect width="56" height="18" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <g transform="translate(7, 5)" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 0 -->
        <rect x="0" y="0" width="5" height="8" rx="2.5" />
        <!-- . -->
        <circle cx="8.5" cy="7.5" r="0.5" fill="#58A6FF" />
        <!-- 0 -->
        <rect x="12" y="0" width="5" height="8" rx="2.5" />
        <!-- , -->
        <path d="M 20.5 7.5 L 19.5 9.5" />
        <!-- 0 -->
        <rect x="25" y="0" width="5" height="8" rx="2.5" />
        <!-- . -->
        <circle cx="33.5" cy="7.5" r="0.5" fill="#58A6FF" />
        <!-- 0 -->
        <rect x="37" y="0" width="5" height="8" rx="2.5" />
      </g>
    </g>
  </g>

  <!-- Тонкий вертикальный разделитель -->
  <line x1="274" y1="44" x2="274" y2="176" stroke="#21293A" stroke-width="1.5" />

  <!-- ================= ТЕКСТ В КРИВЫХ (MOTORSPORT CIRCUITS .JSON) ================= -->
  <g transform="translate(310, 66)">
    
    <!-- MOTORSPORT -->
    <g fill="none" stroke="#F0F6FC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 32 L 0 0 L 13 18 L 26 0 L 26 32" />
      <rect x="38" y="0" width="22" height="32" rx="6" />
      <path d="M 70 0 L 92 0 M 81 0 L 81 32" />
      <rect x="102" y="0" width="22" height="32" rx="6" />
      <path d="M 136 32 L 136 0 L 150 0 C 159 0, 159 16, 150 16 L 136 16 M 147 16 L 157 32" />
      <path d="M 190 5 C 190 0, 169 0, 169 8 C 169 18, 190 14, 190 24 C 190 32, 169 32, 169 27" />
      <path d="M 202 32 L 202 0 L 216 0 C 225 0, 225 16, 216 16 L 202 16" />
      <rect x="235" y="0" width="22" height="32" rx="6" />
      <path d="M 269 32 L 269 0 L 283 0 C 292 0, 292 16, 283 16 L 269 16 M 280 16 L 290 32" />
      <path d="M 301 0 L 323 0 M 312 0 L 312 32" />
    </g>

    <!-- CIRCUITS -->
    <g transform="translate(0, 54)" fill="none" stroke="#8B949E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 5 C 18 0, 0 0, 0 13 C 0 26, 18 26, 20 21" />
      <path d="M 32 0 L 32 26" />
      <path d="M 44 26 L 44 0 L 56 0 C 63 0, 63 13, 56 13 L 44 13 M 53 13 L 61 26" />
      <path d="M 92 5 C 90 0, 72 0, 72 13 C 72 26, 90 26, 92 21" />
      <path d="M 104 0 L 104 18 C 104 26, 122 26, 122 18 L 122 0" />
      <path d="M 134 0 L 134 26" />
      <path d="M 145 0 L 163 0 M 154 0 L 154 26" />
      <path d="M 190 4 C 190 0, 173 0, 173 6.5 C 173 14, 190 12, 190 19.5 C 190 26, 173 26, 173 22" />
    </g>

    <!-- Бейдж .JSON -->
    <g transform="translate(212, 47)">
      <rect width="102" height="40" rx="8" fill="#131D2E" stroke="#58A6FF" stroke-width="1.8" />
      <g transform="translate(18, 10)" fill="none" stroke="#58A6FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="2" cy="18" r="1.2" fill="#58A6FF" />
        <path d="M 19 0 L 19 14 C 19 20, 10 20, 10 15" />
        <path d="M 38 3 C 38 0, 26 0, 26 5 C 26 11, 38 9, 38 15 C 38 20, 26 20, 26 17" />
        <rect x="45" y="0" width="13" height="20" rx="4" />
        <path d="M 65 20 L 65 0 L 77 20 L 77 0" />
      </g>
    </g>

  </g>
</svg>